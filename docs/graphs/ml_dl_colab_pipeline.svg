<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" width="1120" height="400" role="img" aria-label="Diagrama Mermaid horizontal del entrenamiento dual en la nube y local hasta el uso en la web">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0B3D91" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#78350F" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C82812" />
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#065F46" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="400" rx="8" fill="#F4F7FB" stroke="#C5D3E8" stroke-width="1.5" />
  <text x="560" y="28" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">
    Flujo completo paso a paso: de los datos de la NASA a los 5 archivos verificados en la página web
  </text>

  <!-- Subgraph 1: Datos -->
  <rect x="18" y="44" width="242" height="338" rx="8" fill="#EDF2FA" stroke="#0B3D91" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="139" y="65" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">1. DATOS ORIGINALES NASA</text>

  <rect x="30" y="82" width="218" height="72" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="139" y="106" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">24 Estudios Oficiales (PSI)</text>
  <text x="139" y="125" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">Textos, materiales y sensores</text>
  <text x="139" y="142" text-anchor="middle" fill="#0B3D91" font-family="Consolas, monospace" font-size="10">psi_combustion_24.json (CC0)</text>

  <rect x="30" y="172" width="218" height="80" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="139" y="196" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">566 Pruebas de Cabina</text>
  <text x="139" y="215" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">BASS-II (240) + Saffire (272) + FLEX (54)</text>
  <text x="139" y="233" text-anchor="middle" fill="#0B3D91" font-family="Consolas, monospace" font-size="10">256 extinguidas / 310 sostenidas</text>

  <rect x="30" y="270" width="218" height="92" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="139" y="294" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Cámara 64×64 y Ducto</text>
  <text x="139" y="313" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">180 imágenes + 600 lecturas sensor</text>
  <text x="139" y="331" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.5">(Simulador calibrado sin bajar 255.77 GB)</text>
  <text x="139" y="349" text-anchor="middle" fill="#0B3D91" font-family="Consolas, monospace" font-size="10">OSDR opcional en nube GPU</text>

  <!-- Subgraph 2: Medios de entrenamiento -->
  <rect x="294" y="44" width="250" height="338" rx="8" fill="#FEF3C7" fill-opacity="0.4" stroke="#78350F" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="419" y="65" text-anchor="middle" fill="#78350F" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">2. MEDIOS DE ENTRENAMIENTO</text>

  <rect x="308" y="92" width="222" height="122" rx="6" fill="#FFFFFF" stroke="#78350F" stroke-width="1.6" />
  <text x="419" y="116" text-anchor="middle" fill="#78350F" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Nube con GPU (Google Colab)</text>
  <text x="419" y="136" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">1. Descarga selectiva desde OSDR</text>
  <text x="419" y="155" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">2. Gira fotos 90°, 180°, 270° en 0g</text>
  <text x="419" y="174" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">3. Entrena red visual por 45 rondas</text>
  <text x="419" y="196" text-anchor="middle" fill="#78350F" font-family="Consolas, monospace" font-size="10">AERO_IGNIS_Colab_Training.ipynb</text>

  <rect x="308" y="236" width="222" height="122" rx="6" fill="#FFFFFF" stroke="#065F46" stroke-width="1.6" />
  <text x="419" y="260" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Tu Computadora (CPU Local)</text>
  <text x="419" y="280" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">1. Semilla fija = 42 (reproducible)</text>
  <text x="419" y="299" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">2. Tarda menos de 5 segundos</text>
  <text x="419" y="318" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">3. Valida 5 exámenes cruzados (CV)</text>
  <text x="419" y="340" text-anchor="middle" fill="#065F46" font-family="Consolas, monospace" font-size="10">backend/train_models.py</text>

  <!-- Subgraph 3: Modelos generados -->
  <rect x="578" y="44" width="260" height="338" rx="8" fill="#FFEAE5" fill-opacity="0.45" stroke="#C82812" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="708" y="65" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">3. MODELOS Y SELLO (368.9 KB)</text>

  <rect x="592" y="80" width="232" height="64" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="708" y="102" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Modelo 1 · Riesgo de Fuego</text>
  <text x="708" y="120" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">120 Árboles + Gradiente · 78.49% CV</text>
  <text x="708" y="135" text-anchor="middle" fill="#0B3D91" font-family="Consolas, monospace" font-size="9.8">flammability_rf + burntime_gbr</text>

  <rect x="592" y="156" width="232" height="66" rx="6" fill="#FFFFFF" stroke="#C82812" stroke-width="1.6" />
  <text x="708" y="178" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Modelo 2 · Visión y Ducto</text>
  <text x="708" y="196" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Red Visual 64×64 + Reglas humo/CO</text>
  <text x="708" y="212" text-anchor="middle" fill="#C82812" font-family="Consolas, monospace" font-size="9.8">100% en partición sintética (11.7 KB)</text>

  <rect x="592" y="234" width="232" height="64" rx="6" fill="#FFFFFF" stroke="#065F46" stroke-width="1.6" />
  <text x="708" y="256" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Modelo 3 · Mapa 24 Estudios</text>
  <text x="708" y="274" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Palabras clave + 4 Cuadrantes + TOPSIS</text>
  <text x="708" y="290" text-anchor="middle" fill="#065F46" font-family="Consolas, monospace" font-size="9.8">psi_tfidf_kmeans.joblib (20.2 KB)</text>

  <rect x="592" y="310" width="232" height="58" rx="6" fill="#FFEAE5" stroke="#9E1C0B" stroke-width="1.6" />
  <text x="708" y="332" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">Sello de Integridad 256 bits</text>
  <text x="708" y="351" text-anchor="middle" fill="#1E2E4A" font-family="Consolas, monospace" font-size="10">Evita archivos alterados al cargar</text>

  <!-- Subgraph 4: En la web -->
  <rect x="872" y="44" width="230" height="338" rx="8" fill="#E6F6F0" fill-opacity="0.55" stroke="#065F46" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="987" y="65" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">4. USO EN LA PÁGINA WEB</text>

  <rect x="886" y="96" width="202" height="96" rx="6" fill="#FFFFFF" stroke="#065F46" stroke-width="1.6" />
  <text x="987" y="122" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">Control de Seguridad</text>
  <text x="987" y="142" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">Verifica firma de archivos</text>
  <text x="987" y="160" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">Rechaza datos fuera de rango</text>
  <text x="987" y="178" text-anchor="middle" fill="#065F46" font-family="Consolas, monospace" font-size="10">Respuesta &lt; 5 milisegundos</text>

  <rect x="886" y="220" width="202" height="132" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.8" />
  <text x="987" y="246" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">7 Estaciones Interactivas</text>
  <text x="987" y="268" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">• Explorador 24 PSI y Mapa</text>
  <text x="987" y="287" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">• Simulador ISS / Luna / Apollo</text>
  <text x="987" y="306" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">• Gemelo Cortafuego del Ducto</text>
  <text x="987" y="325" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="11">• Descargas Abiertas (.py/.onnx)</text>

  <!-- Conexiones curvas estilo Mermaid -->
  <path d="M 248 118 C 276 118, 282 140, 308 140" fill="none" stroke="#0B3D91" stroke-width="1.7" marker-end="url(#arrBlue)" />
  <path d="M 248 212 C 276 212, 282 280, 308 280" fill="none" stroke="#0B3D91" stroke-width="1.7" marker-end="url(#arrBlue)" />
  <path d="M 248 316 C 276 316, 282 178, 308 178" fill="none" stroke="#78350F" stroke-width="1.7" marker-end="url(#arrAmber)" />
  <path d="M 248 326 C 276 326, 282 320, 308 320" fill="none" stroke="#065F46" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrGreen)" />

  <path d="M 530 148 C 556 148, 566 188, 592 188" fill="none" stroke="#78350F" stroke-width="1.8" marker-end="url(#arrAmber)" />
  <path d="M 530 270 C 556 270, 566 112, 592 112" fill="none" stroke="#065F46" stroke-width="1.7" marker-end="url(#arrGreen)" />
  <path d="M 530 296 C 556 296, 566 266, 592 266" fill="none" stroke="#065F46" stroke-width="1.7" marker-end="url(#arrGreen)" />
  <path d="M 530 330 C 556 330, 566 338, 592 338" fill="none" stroke="#C82812" stroke-width="1.7" marker-end="url(#arrRed)" />

  <path d="M 824 112 C 852 112, 858 144, 886 144" fill="none" stroke="#0B3D91" stroke-width="1.7" marker-end="url(#arrBlue)" />
  <path d="M 824 189 C 852 189, 858 156, 886 156" fill="none" stroke="#C82812" stroke-width="1.7" marker-end="url(#arrRed)" />
  <path d="M 824 266 C 852 266, 858 168, 886 168" fill="none" stroke="#065F46" stroke-width="1.7" marker-end="url(#arrGreen)" />
  <path d="M 824 338 C 856 338, 862 182, 886 182" fill="none" stroke="#9E1C0B" stroke-width="1.8" marker-end="url(#arrRed)" />
  <path d="M 987 192 L 987 220" fill="none" stroke="#065F46" stroke-width="2" marker-end="url(#arrGreen)" />
</svg>
