<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" role="img" aria-label="Diagrama Mermaid horizontal conectando las 4 familias de estudios NASA con los 3 modelos y las secciones de la página">
  <defs>
    <marker id="kBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0B3D91" />
    </marker>
    <marker id="kRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#C82812" />
    </marker>
    <marker id="kGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#065F46" />
    </marker>
    <marker id="kPurple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B2E83" />
    </marker>
    <marker id="kAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#78350F" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="450" rx="8" fill="#F4F7FB" stroke="#C5D3E8" stroke-width="1.5" />
  <text x="560" y="28" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">
    Cómo se conectan las 24 investigaciones de la NASA con cada herramienta de AERO-IGNIS SI
  </text>

  <!-- Col 1: 4 Familias de Estudios -->
  <rect x="18" y="44" width="268" height="390" rx="8" fill="#EDF2FA" stroke="#0B3D91" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="152" y="65" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">1. LAS 4 FAMILIAS (24 ESTUDIOS)</text>

  <rect x="30" y="78" width="244" height="76" rx="6" fill="#FFEAE5" stroke="#C82812" stroke-width="1.6" />
  <text x="152" y="99" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">Cuadrante I · Gotas y Llamas Frías (5)</text>
  <text x="152" y="117" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.5">FLEX, FLEX-2, FLEX-2J, MDCA, CFI-G</text>
  <text x="152" y="135" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Llamas invisibles de baja temperatura</text>

  <rect x="30" y="166" width="244" height="76" rx="6" fill="#E6F6F0" stroke="#065F46" stroke-width="1.6" />
  <text x="152" y="187" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">Cuadrante II · Incendios Cygnus (6)</text>
  <text x="152" y="205" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.5">SAFFIRE I, II, III, IV, V y VI</text>
  <text x="152" y="223" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Fuego real hasta 34% O2 · 8.2 psi</text>

  <rect x="30" y="254" width="244" height="76" rx="6" fill="#E0ECFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="152" y="275" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">Cuadrante III · Gases y Campos (8)</text>
  <text x="152" y="293" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.5">ACME (4), SLICE, SPICE, CVB y CVB-2</text>
  <text x="152" y="311" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Humo &lt;0.1 um, hollín y alto voltaje kV</text>

  <rect x="30" y="342" width="244" height="78" rx="6" fill="#F3E8FF" stroke="#4B2E83" stroke-width="1.6" />
  <text x="152" y="363" text-anchor="middle" fill="#4B2E83" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">Cuadrante IV · Sólidos y Brasas (5)</text>
  <text x="152" y="381" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.5">BASS, BASS-II, BRE, NCA y MSC</text>
  <text x="152" y="399" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Telas, PMMA, cables y espumas lentas</text>

  <!-- Col 2: Que extraemos de ellos -->
  <rect x="320" y="44" width="240" height="390" rx="8" fill="#E8EEF7" stroke="#415678" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="440" y="65" text-anchor="middle" fill="#0A1931" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">2. EVIDENCIA EXTRAÍDA</text>

  <rect x="334" y="88" width="212" height="92" rx="6" fill="#FFFFFF" stroke="#C82812" stroke-width="1.6" />
  <text x="440" y="112" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Señales Ópticas y Humo</text>
  <text x="440" y="131" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Forma esférica azul, llamas frías</text>
  <text x="440" y="149" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">y partículas &lt;0.1 micras + CO</text>
  <text x="440" y="167" text-anchor="middle" fill="#415678" font-family="Consolas, monospace" font-size="9.8">FLEX + SPICE + MSC + ACME</text>

  <rect x="334" y="198" width="212" height="96" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="440" y="222" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Límites Físicos de Fuego</text>
  <text x="440" y="241" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">566 corridas calibradas (% O2,</text>
  <text x="440" y="259" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">presión, flujo de aire y espesor)</text>
  <text x="440" y="277" text-anchor="middle" fill="#415678" font-family="Consolas, monospace" font-size="9.8">BASS-II + Saffire I–VI + NCA</text>

  <rect x="334" y="312" width="212" height="102" rx="6" fill="#FFFFFF" stroke="#065F46" stroke-width="1.6" />
  <text x="440" y="336" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Lecciones e Impacto Civil</text>
  <text x="440" y="355" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Textos PSI + Apollo 1, 13 y Mir</text>
  <text x="440" y="373" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">+ Spinoffs 9582, 9407, 9918 y PFE</text>
  <text x="440" y="393" text-anchor="middle" fill="#415678" font-family="Consolas, monospace" font-size="9.8">Norma NASA-STD-6001</text>

  <!-- Col 3: Modelos -->
  <rect x="594" y="44" width="248" height="390" rx="8" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="718" y="65" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">3. MODELOS DEL OBSERVATORIO</text>

  <rect x="608" y="84" width="220" height="80" rx="6" fill="#FFEAE5" stroke="#C82812" stroke-width="1.6" />
  <text x="718" y="107" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Modelo 2 · Vigilante de Ducto</text>
  <text x="718" y="126" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Red Visual 64×64 + Reglas sensor</text>
  <text x="718" y="144" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Cierra compuerta y activa niebla PFE</text>

  <rect x="608" y="178" width="220" height="82" rx="6" fill="#E0ECFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="718" y="201" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Modelo 1 · Predicción Cabina</text>
  <text x="718" y="220" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">120 Árboles + Regresor velocidad</text>
  <text x="718" y="238" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Calcula extinción y números Da / Pe</text>

  <rect x="608" y="274" width="220" height="78" rx="6" fill="#E6F6F0" stroke="#065F46" stroke-width="1.6" />
  <text x="718" y="297" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Modelo 3 · Mapa y Síntesis</text>
  <text x="718" y="316" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Agrupa 24 PSI en 4 cuadrantes</text>
  <text x="718" y="334" text-anchor="middle" fill="#415678" font-family="Segoe UI, sans-serif" font-size="10">Ordena por tus pesos sin inventar</text>

  <rect x="608" y="366" width="220" height="54" rx="6" fill="#FEF3C7" stroke="#78350F" stroke-width="1.6" />
  <text x="718" y="388" text-anchor="middle" fill="#78350F" font-family="Segoe UI, sans-serif" font-size="11.8" font-weight="700">Matriz FMEA y Beneficio Civil</text>
  <text x="718" y="407" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.5">Reduce riesgo (-93% NPR) y peso</text>

  <!-- Col 4: Secciones en la Web -->
  <rect x="876" y="44" width="226" height="390" rx="8" fill="#E6F6F0" fill-opacity="0.45" stroke="#065F46" stroke-width="1.4" stroke-dasharray="6 4" />
  <text x="989" y="65" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700">4. SECCIONES PARA EL USUARIO</text>

  <rect x="890" y="88" width="198" height="72" rx="6" fill="#FFFFFF" stroke="#C82812" stroke-width="1.6" />
  <text x="989" y="114" text-anchor="middle" fill="#9E1C0B" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">04 · Gemelo del Ducto</text>
  <text x="989" y="135" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Detecta llama oculta y apaga</text>

  <rect x="890" y="178" width="198" height="72" rx="6" fill="#FFFFFF" stroke="#0B3D91" stroke-width="1.6" />
  <text x="989" y="204" text-anchor="middle" fill="#0B3D91" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">03 · Inflamabilidad Cabina</text>
  <text x="989" y="225" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Curvas ISS, Artemis y Apollo</text>

  <rect x="890" y="268" width="198" height="72" rx="6" fill="#FFFFFF" stroke="#065F46" stroke-width="1.6" />
  <text x="989" y="294" text-anchor="middle" fill="#065F46" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">02 · Explorador 24 PSI</text>
  <text x="989" y="315" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">4 cuadrantes y lectura adaptada</text>

  <rect x="890" y="358" width="198" height="64" rx="6" fill="#FFFFFF" stroke="#78350F" stroke-width="1.6" />
  <text x="989" y="384" text-anchor="middle" fill="#78350F" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">05 · Riesgo y Tierra</text>
  <text x="989" y="405" text-anchor="middle" fill="#1E2E4A" font-family="Segoe UI, sans-serif" font-size="10.8">Seguridad civil en bomberos</text>

  <!-- Flechas -->
  <path d="M 274 116 C 304 116, 304 128, 334 128" fill="none" stroke="#C82812" stroke-width="1.7" marker-end="url(#kRed)" />
  <path d="M 274 204 C 304 204, 304 236, 334 236" fill="none" stroke="#065F46" stroke-width="1.7" marker-end="url(#kGreen)" />
  <path d="M 274 292 C 304 292, 304 148, 334 148" fill="none" stroke="#0B3D91" stroke-width="1.6" marker-end="url(#kBlue)" />
  <path d="M 274 378 C 304 378, 304 260, 334 260" fill="none" stroke="#4B2E83" stroke-width="1.6" marker-end="url(#kPurple)" />
  <path d="M 274 394 C 304 394, 304 364, 334 364" fill="none" stroke="#4B2E83" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#kPurple)" />

  <path d="M 546 134 C 578 134, 578 124, 608 124" fill="none" stroke="#C82812" stroke-width="1.8" marker-end="url(#kRed)" />
  <path d="M 546 246 C 578 246, 578 219, 608 219" fill="none" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#kBlue)" />
  <path d="M 546 348 C 578 348, 578 313, 608 313" fill="none" stroke="#065F46" stroke-width="1.8" marker-end="url(#kGreen)" />
  <path d="M 546 382 C 578 382, 578 393, 608 393" fill="none" stroke="#78350F" stroke-width="1.8" marker-end="url(#kAmber)" />

  <path d="M 828 124 L 890 124" fill="none" stroke="#C82812" stroke-width="1.8" marker-end="url(#kRed)" />
  <path d="M 828 214 L 890 214" fill="none" stroke="#0B3D91" stroke-width="1.8" marker-end="url(#kBlue)" />
  <path d="M 828 308 L 890 308" fill="none" stroke="#065F46" stroke-width="1.8" marker-end="url(#kGreen)" />
  <path d="M 828 390 L 890 390" fill="none" stroke="#78350F" stroke-width="1.8" marker-end="url(#kAmber)" />
</svg>
